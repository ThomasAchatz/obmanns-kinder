# Spielt Datenbank-Änderungen und Edge Functions in dein Supabase-Projekt ein.
# Braucht die Secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF und SUPABASE_DB_PASSWORD.
name: Supabase aktualisieren

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secrets prüfen
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase-Secrets fehlen noch (siehe SETUP.md). Nichts eingespielt."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Immer den neuesten Stand holen: „Song-Startpaket laden“ kann in der Zwischenzeit
      # eine Migration committet haben.
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: main

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.120.0

      - name: Projekt verknüpfen
        if: steps.check.outputs.ready == 'true'
        run: |
          if ! supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > /tmp/link.log 2>&1; then
            cat /tmp/link.log
            echo "::error::supabase link: $(tail -c 500 /tmp/link.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Datenbank aktualisieren
        if: steps.check.outputs.ready == 'true'
        run: |
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD" > /tmp/push.log 2>&1; then
            cat /tmp/push.log
            echo "::error::supabase db push: $(tail -c 500 /tmp/push.log | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/push.log

      - name: Edge Functions veröffentlichen
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
