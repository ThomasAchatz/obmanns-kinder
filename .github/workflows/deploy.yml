# Baut die App und veröffentlicht sie auf GitHub Pages.
name: App veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: App bauen
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Hinweis bei fehlender Konfiguration
        if: ${{ vars.VITE_SUPABASE_URL == '' || vars.VITE_SUPABASE_ANON_KEY == '' }}
        run: echo "::warning::VITE_SUPABASE_URL oder VITE_SUPABASE_ANON_KEY fehlt (Settings → Secrets and variables → Actions → Variables). Die App zeigt dann nur einen Einrichtungs-Hinweis."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
