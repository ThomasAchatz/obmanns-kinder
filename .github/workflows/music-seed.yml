# Sucht die Songs aus music/startpaket.json bei iTunes (30-Sekunden-Vorschau),
# schreibt eine Migration und spielt sie direkt in Supabase ein.
# Läuft automatisch, wenn sich die Song-Liste ändert, oder per Hand unter „Actions“.
name: Song-Startpaket laden

on:
  push:
    branches: [main]
    paths: ["music/startpaket.json", "scripts/resolve-songs.mjs", "scripts/build-catalog.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Songs bei iTunes suchen
        id: resolve
        run: node scripts/resolve-songs.mjs

      - name: Song-Katalog für den Hard-Mode bauen
        run: node scripts/build-catalog.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/resolved.json music/catalog.json supabase/migrations
          if git diff --cached --quiet; then
            echo "Nichts Neues."
          else
            git commit -m "Song-Startpaket aufgelöst [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      - name: In Supabase einspielen
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
