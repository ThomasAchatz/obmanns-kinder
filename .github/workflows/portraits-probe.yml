# Nur Vorbereitung der Bilderrunde: holt Kandidaten und eine Bild-Stichprobe
# und legt sie im Ordner probe/ auf diesem Branch ab. Läuft ausschließlich auf
# dem Branch bilder-vorbereitung, ändert nichts an App oder Datenbank.
name: Bilderrunde Probelauf
on:
  push:
    branches: [bilder-vorbereitung]
    paths: ["scripts/portraits-probe.py", ".github/workflows/portraits-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install opencv-python-headless pillow numpy
      - name: Probelauf
        run: |
          mkdir -p out
          set -o pipefail
          python -u scripts/portraits-probe.py 2>&1 | tee out/log.txt
      - name: Ergebnis auf den Branch legen
        if: always()
        run: |
          rm -rf probe && mv out probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -qm "Probelauf-Ergebnis [skip ci]" && git push origin HEAD:bilder-vorbereitung || echo "nichts"
