# Minimale Supabase-CLI-Konfiguration für das Deployment per GitHub Action.
project_id = "obmanns-kinder"

[functions.admin-users]
verify_jwt = true

# Wird von der Datenbank mit eigenem Secret aufgerufen und liefert per GET nur den
# öffentlichen Schlüssel – daher ohne JWT-Prüfung am Gateway.
[functions.push]
verify_jwt = false

# Songsuche (iTunes) und frische Vorschau-Links – nur für angemeldete Spieler.
[functions.music]
verify_jwt = true
